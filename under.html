:root{--bg:#f4f1ff;--text:#14122b;--g1:#6a5cff;--g2:#ff5fa2;--g3:#ffb347;--pill:rgba(255,255,255,.7);--line:rgba(20,18,43,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b1e;--text:#f4f2ff;--pill:rgba(255,255,255,.06);--line:rgba(255,255,255,.14)}}
:root[data-theme="dark"]{--bg:#0d0b1e;--text:#f4f2ff;--pill:rgba(255,255,255,.06);--line:rgba(255,255,255,.14)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--text);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(60% 50% at 15% 10%,color-mix(in srgb,var(--g1) 35%,transparent),transparent),
radial-gradient(55% 50% at 90% 20%,color-mix(in srgb,var(--g2) 30%,transparent),transparent),
radial-gradient(60% 50% at 50% 100%,color-mix(in srgb,var(--g3) 30%,transparent),transparent),var(--bg)}
main{width:100%;max-width:760px}
h1{margin:0 0 40px;font-size:clamp(44px,12vw,104px);line-height:1;letter-spacing:-.04em;font-weight:800;
background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
nav a{width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--line);background:var(--pill);color:var(--text);backdrop-filter:blur(6px);transition:border-color .15s,color .15s}
nav a:hover,nav a:focus-visible{border-color:var(--g2);color:var(--g2);outline:none}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
